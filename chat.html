<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA — Francesco Action</title>
<link rel="stylesheet" href="style.css">
<style>
.chat{max-width:760px;margin:auto;padding:0 5% 30px}
.msg{max-width:85%;padding:12px 16px;border-radius:14px;margin-bottom:12px;white-space:pre-wrap;word-wrap:break-word}
.user{background:#6c5ce7;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bot{background:#1a1a1a;border:1px solid #2e2e2e;color:#ddd;border-bottom-left-radius:4px}
.meta{font-size:11px;color:#888;margin-top:6px}
.zone{display:flex;gap:10px;margin-top:16px}
.zone .champ{margin:0;flex:1}
select.champ{margin-right:10px;width:auto}
</style></head>
<body>
<header class="header">
  <a class="logo" href="app.html">☰ Francesco <span>Action</span></a>
  <nav><a href="analyse.html">Analyse</a><a href="marketing.html">Marketing IA</a><a class="btn small" href="offres.html">Commencer</a></nav>
</header>
<section class="section" style="padding-top:30px;padding-bottom:10px">
  <h2>Chat <em>IA</em></h2>
  <p class="muted">Choisis ton assistant et discute : stratégies, idées, rédaction…</p>
</section>
<div class="chat">
  <select id="modele" class="champ"><option>Chargement des modèles…</option></select>
  <div id="fil"></div>
  <div class="zone">
    <input id="saisie" class="champ" placeholder="Écris ton message…" onkeydown="if(event.key==='Enter')envoyer()">
    <button class="btn" id="btnE" onclick="envoyer()">Envoyer</button>
  </div>
</div>
<footer class="footer"><p>© 2026 Francesco Action</p></footer>
<script>
let historique = [];
const fil = document.getElementById('fil');
function bulle(texte, qui, note) {
  const d = document.createElement('div');
  d.className = 'msg ' + qui;
  d.textContent = texte;
  if (note) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = note; d.appendChild(m); }
  fil.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
}
(async () => {
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ liste: true }) });
    const d = await r.json();
    const noms = { gemini:'Gemini (Google)', deepseek:'DeepSeek', openai:'ChatGPT (OpenAI)', claude:'Claude (Anthropic)' };
    const sel = document.getElementById('modele');
    sel.innerHTML = '';
    (d.disponible || []).forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = noms[m] || m; sel.appendChild(o); });
    if (!d.disponible || !d.disponible.length) { sel.innerHTML = '<option>Aucun modèle configuré</option>'; }
  } catch (e) { document.getElementById('modele').innerHTML = '<option>Erreur de connexion</option>'; }
})();
async function envoyer() {
  const inp = document.getElementById('saisie'), btn = document.getElementById('btnE');
  const texte = inp.value.trim(); if (!texte) return;
  inp.value = '';
  bulle(texte, 'user');
  const bot = document.createElement('div'); bot.className = 'msg bot'; bot.textContent = '🤖 Réflexion…'; fil.appendChild(bot);
  btn.disabled = true;
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: texte, modele: document.getElementById('modele').value, historique }) });
    const d = await r.json();
    fil.removeChild(bot);
    if (d.reponse) { bulle(d.reponse, 'bot', 'via ' + (d.utilise||'')); historique.push({role:'user',content:texte}); historique.push({role:'assistant',content:d.reponse}); }
    else bulle('Erreur : ' + (d.error || 'inconnue'), 'bot');
  } catch (e) { fil.removeChild(bot); bulle('Erreur de connexion : ' + e.message, 'bot'); }
  btn.disabled = false;
}
</script>
</body></html>
