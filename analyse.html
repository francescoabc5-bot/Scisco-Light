<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyse Marketing — Francesco Action</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="header">
  <a class="logo" href="/">Francesco <span>Action</span></a>
  <nav><a href="offres.html">Offres</a><a href="exemples.html">Exemples</a><a href="faq.html">FAQ</a><a href="marketing.html">Marketing IA</a><a class="btn small" href="offres.html">Commencer</a></nav>
</header>
<section class="section" style="padding-top:40px">
  <h2>Analyse <em>Marketing</em> gratuite</h2>
  <p class="muted">Colle le texte de ta pub ou décris ton produit. Diagnostic complet en 30 secondes.</p>
  <div class="card" style="text-align:left">
    <textarea id="pubTexte" class="champ" style="min-height:140px" placeholder="Exemple : Je vends des sacs à main en cuir à 15 000 FCFA sur WhatsApp. Ma pub dit : 'Beaux sacs disponibles, DM pour le prix'..."></textarea>
    <button class="btn" id="btnAnalyse" onclick="lancer()">Analyser ma pub</button>
    <div id="resultat" class="resultat"></div>
  </div>
</section>
<footer class="footer"><p>© 2026 Francesco Action</p></footer>
<script>
function carte(titre, emoji, contenu) {
  if (!contenu) return '';
  return '<div class="carte-ia"><h3>' + emoji + ' ' + titre + '</h3><div class="contenu">' + contenu.replace(/</g,'&lt;') + '</div></div>';
}
async function lancer() {
  const btn = document.getElementById('btnAnalyse'), res = document.getElementById('resultat');
  const texte = document.getElementById('pubTexte').value;
  if (texte.trim().length < 20) { res.innerHTML = '<p style="color:#e79b9b">⚠️ Écris au moins quelques phrases.</p>'; return; }
  btn.disabled = true; btn.textContent = 'Analyse en cours…'; res.innerHTML = '<p style="color:#888">🤖 L\'IA réfléchit…</p>';
  try {
    const r = await fetch('/api/analyze', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({texte})});
    const d = await r.json();
    if (!d.analyse) { res.innerHTML = '<p style="color:#e79b9b">Erreur : ' + (d.error||'inconnue').replace(/</g,'&lt;') + '</p>'; }
    else {
      const t = d.analyse;
      const x = (m, s) => { const i = t.indexOf(m); if (i===-1) return ''; const j = s ? t.indexOf(s, i+m.length) : -1; return t.slice(i+m.length, j===-1?undefined:j).trim(); };
      res.innerHTML =
        carte('Points forts & faibles', '🔍', x('###ANALYSE###','###CIBLE###')) +
        carte('Public cible', '🎯', x('###CIBLE###','###ANGLES###')) +
        carte('5 accroches améliorées', '⚡', x('###ANGLES###','###NOTE###')) +
        carte('Note globale', '⭐', x('###NOTE###'));
      if (!res.innerHTML) res.innerHTML = '<div class="carte-ia"><div class="contenu">' + t.replace(/</g,'&lt;') + '</div></div>';
    }
  } catch (e) { res.innerHTML = '<p style="color:#e79b9b">Erreur de connexion : ' + e.message + '</p>'; }
  btn.disabled = false; btn.textContent = 'Analyser ma pub';
}
</script>
</body></html>
