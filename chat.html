<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat IA — Scisco Studio</title>
<link rel="stylesheet" href="style.css">
<style>
.chat{max-width:720px;margin:auto;padding:20px 5%}
.msgs{display:flex;flex-direction:column;gap:14px;margin:18px 0}
.bulle{max-width:85%;padding:12px 16px;border-radius:14px;white-space:pre-wrap;color:#ccc;font-size:14px}
.user{align-self:flex-end;background:#6c5ce7;color:#fff}
.ia{align-self:flex-start;background:#1a1a1a;border:1px solid #2e2e2e}
.selecteur{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sel{padding:7px 16px;border-radius:18px;background:#1a1a1a;border:1px solid #2e2e2e;color:#ccc;cursor:pointer;font-size:13px}
.sel.actif{background:#6c5ce7;border-color:#6c5ce7;color:#fff}
</style></head>
<body>
<header class="header">
  <a class="logo" href="app.html">← <span>Scisco Studio</span></a>
  <a class="btn small" href="offres.html">⚡ Crédits</a>
</header>
<section class="chat">
  <h2>💬 Chat <em style="color:#6c5ce7;font-style:normal">IA</em></h2>
  <p class="muted">Choisis ton assistant : chaque modèle a ses forces. Mode Auto = le premier disponible.</p>
  <div class="selecteur" id="modeles">
    <div class="sel actif" data-m="auto">⚡ Auto</div>
    <div class="sel" data-m="chatgpt">🤖 ChatGPT</div>
    <div class="sel" data-m="claude">🎭 Claude</div>
    <div class="sel" data-m="deepseek">🐋 DeepSeek</div>
    <div class="sel" data-m="gemini">✨ Gemini</div>
  </div>
  <div class="msgs" id="msgs"></div>
  <textarea id="saisie" class="champ" style="min-height:80px" placeholder="Pose ta question marketing…"></textarea>
  <button class="btn" id="btnEnvoyer" onclick="envoyer()">Envoyer</button>
</section>
<footer class="footer"><p>© 2026 Scisco Studio</p></footer>
<script>
let modeleChoisi='auto', historique=[];
document.querySelectorAll('#modeles .sel').forEach(s=>s.onclick=()=>{
  document.querySelectorAll('#modeles .sel').forEach(x=>x.classList.remove('actif'));
  s.classList.add('actif'); modeleChoisi=s.dataset.m;
});
async function envoyer(){
  const btn=document.getElementById('btnEnvoyer'), saisie=document.getElementById('saisie'), msgs=document.getElementById('msgs');
  const texte=saisie.value.trim(); if(!texte) return;
  btn.disabled=true; saisie.value='';
  historique.push({role:'user',content:texte});
  msgs.innerHTML+='<div class="bulle user">'+texte.replace(/</g,'&lt;')+'</div>';
  const bulleIA=document.createElement('div'); bulleIA.className='bulle ia'; bulleIA.textContent='…';
  msgs.appendChild(bulleIA); msgs.scrollIntoView(false);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:historique,modele:modeleChoisi})});
    const d=await r.json();
    if(!d.reponse){ bulleIA.innerHTML='<span style="color:#e79b9b">Erreur : '+(d.error||'inconnue').replace(/</g,'&lt;')+'</span>'; historique.pop(); }
    else{ bulleIA.textContent=d.reponse + (d.utilise?' — ['+d.utilise+']':''); historique.push({role:'assistant',content:d.reponse}); }
  }catch(e){ bulleIA.innerHTML='<span style="color:#e79b9b">Erreur de connexion : '+e.message+'</span>'; historique.pop(); }
  btn.disabled=false;
}
</script>
</body></html>
