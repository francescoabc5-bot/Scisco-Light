<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espion Concurrent — Francesco Action</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header class="header">
  <a class="logo" href="app.html">☰ Francesco <span>Action</span></a>
  <nav><a href="offres.html">Offres</a><a href="faq.html">FAQ</a><a href="analyse.html">Analyse</a><a class="btn small" href="offres.html">Commencer</a></nav>
</header>
<section class="section" style="padding-top:40px">
  <h2>🕵️ Espion <em>Concurrent</em></h2>
  <p class="muted">Décris la pub, l'offre ou l'activité d'un concurrent. L'IA te livre un plan de contre-attaque complet.</p>
  <div class="card" style="text-align:left">
    <textarea id="contenu" class="champ" style="min-height:130px" placeholder="Colle la pub du concurrent ou décris son activité. Ex : 'Il vend des robes wax à 12 000 FCFA sur Instagram, ses pubs disent...'. Tu peux aussi coller la transcription de sa vidéo TikTok."></textarea>
    <input id="monProduit" class="champ" placeholder="(Optionnel) Ton produit/offre à toi, pour une contre-attaque personnalisée">
    <button class="btn" id="btnE" onclick="lancer()">Analyser le concurrent</button>
    <div id="resultat" class="resultat"></div>
  </div>
</section>
<footer class="footer"><p>© 2026 Francesco Action</p></footer>
<script src="limite.js"></script>
<script src="chatwidget.js"></script>
<script>
function carte(titre, emoji, contenu) {
  if (!contenu) return '';
  return '<div class="carte-ia"><h3>' + emoji + ' ' + titre + '</h3><div class="contenu">' + contenu.replace(/</g,'&lt;') + '</div></div>';
}
async function lancer() {
  const btn = document.getElementById('btnE'), res = document.getElementById('resultat');
  const contenu = document.getElementById('contenu').value, monProduit = document.getElementById('monProduit').value;
  if (contenu.trim().length < 20) { res.innerHTML = '<p style="color:#e79b9b">⚠️ Décris le concurrent en quelques phrases au moins.</p>'; return; }
  const verif = await window.sciscoVerifieLimite();
  if (!verif.autorise) { res.innerHTML = '<p style="color:#e79b9b">⛔ ' + (verif.error || 'Limite atteinte.') + ' <a href="offres.html" style="color:#a78bfa">Voir les packs</a></p>'; return; }
  if (typeof verif.reste === 'number') window.sciscoAfficheLimite(verif.reste);
  btn.disabled = true; btn.textContent = 'Enquête en cours… (peut prendre 1 min)';
  res.innerHTML = '<p style="color:#888">🕵️ L\'IA démonte la stratégie du concurrent…</p>';
  try {
    const r = await fetch('/api/espion', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({contenu, monProduit})});
    const d = await r.json();
    if (!d.analyse) { res.innerHTML = '<p style="color:#e79b9b">Erreur : ' + (d.error||'inconnue').replace(/</g,'&lt;') + '</p>'; }
    else {
      const t = d.analyse;
      const x = (m, s) => { const i = t.indexOf(m); if (i===-1) return ''; const j = s ? t.indexOf(s, i+m.length) : -1; return t.slice(i+m.length, j===-1?undefined:j).trim(); };
      res.innerHTML =
        carte('Offre du concurrent', '🔎', x('###OFFRE_CONCURRENT###','###PROMESSE###')) +
        carte('Sa promesse et le désir exploité', '🧲', x('###PROMESSE###','###FAIBLESSES###')) +
        carte('Faiblesses et angles morts', '⚔️', x('###FAIBLESSES###','###FORCE_ADOPTER###')) +
        carte('Ses forces à adopter', '✅', x('###FORCE_ADOPTER###','###DIFFERENCIATION###')) +
        carte('Comment se différencier', '🚀', x('###DIFFERENCIATION###','###ATTAQUE###')) +
        carte("Plan d'attaque immédiat", '🎯', x('###ATTAQUE###','###CONTRE_SCRIPT###')) +
        carte('Script de contre-attaque vidéo', '🎬', x('###CONTRE_SCRIPT###'));
      if (!res.innerHTML.trim()) res.innerHTML = '<div class="carte-ia"><div class="contenu">' + t.replace(/</g,'&lt;') + '</div></div>';
    }
  } catch (e) { res.innerHTML = '<p style="color:#e79b9b">Erreur de connexion : ' + e.message + '</p>'; }
  btn.disabled = false; btn.textContent = 'Analyser le concurrent';
}
</script>
</body></html>
